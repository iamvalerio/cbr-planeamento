<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fim de Obra | CBR Editora</title>
  <style>
    :root{
      /* ── Paleta do Projecto ── */
      --verde:#809751;
      --tijolo:#B0622D;
      --madeira:#C4A882;
      --betao:#8C9198;
      --slate:#5B7A8C;
      --red:#8B3D2E;
      /* ── Superfícies ── */
      --bg:#EDE9E3;
      --card:#FFFFFF;
      /* ── Texto (base quente) ── */
      --lbl:rgba(26,22,16,1);
      --lbl2:rgba(26,22,16,.58);
      --lbl3:rgba(26,22,16,.28);
      --sep:rgba(26,22,16,.1);
      /* ── Sombras quentes ── */
      --shadow-sm:0 1px 3px rgba(60,40,16,.08),0 1px 2px rgba(60,40,16,.05);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--lbl);-webkit-font-smoothing:antialiased}

    /* ── TOP BAR ── */
    .stickytop{position:sticky;top:0;z-index:300;background:rgba(237,233,227,.94);backdrop-filter:saturate(200%) blur(24px);-webkit-backdrop-filter:saturate(200%) blur(24px);border-bottom:0.5px solid var(--sep)}
    .topbar{padding:11px 18px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .topbar-back{font-size:12px;font-weight:600;color:var(--lbl2);text-decoration:none;display:flex;align-items:center;gap:3px;flex-shrink:0}
    .topbar-back:hover{color:var(--verde)}
    .topbar-t{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--lbl)}
    .topbar-s{font-size:11px;color:var(--lbl2);margin-top:1px;font-weight:500;letter-spacing:.1px}
    .topbar-r{display:flex;align-items:center;gap:9px;flex-shrink:0}
    .topbar-pct{font-size:22px;font-weight:700;color:var(--verde);line-height:1}
    .edit-btn{border:1.5px solid var(--sep);background:rgba(26,22,16,.05);color:var(--lbl2);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:all .18s}
    .edit-btn.on{background:var(--verde);color:#fff;border-color:transparent}
    .edit-btn:active{transform:scale(.95)}
    .progress{height:4px;background:rgba(128,151,81,.15)}
    .progress-fill{height:100%;background:var(--verde);width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}

    /* ── BODY / ZONES ── */
    .body{max-width:720px;margin:0 auto;padding:14px 14px calc(60px + env(safe-area-inset-bottom,0px))}
    .zone{margin-top:18px}
    .zone:first-child{margin-top:8px}
    .zone-hd{display:flex;align-items:center;gap:9px;padding:6px 4px 8px;position:sticky;top:78px;background:var(--bg);z-index:2}
    .zone-dot{width:12px;height:12px;border-radius:4px;background:var(--zc,#bbb);flex-shrink:0}
    .zone-name{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--zc,var(--lbl2));flex:1;min-width:0}
    .zone-count{font-size:11px;font-weight:700;color:var(--lbl2);background:rgba(26,22,16,.05);border-radius:99px;padding:3px 10px;flex-shrink:0}
    .zone-pct{font-size:11.5px;font-weight:800;color:#fff;background:var(--zc,var(--verde));border-radius:99px;padding:3px 9px;flex-shrink:0;min-width:38px;text-align:center}

    .item{background:var(--card);border-radius:14px;border-left:4px solid var(--zc,transparent);margin-bottom:6px;padding:12px 14px;display:flex;align-items:flex-start;gap:14px;box-shadow:var(--shadow-sm)}
    .checks{display:flex;gap:11px;flex-shrink:0}
    .ck{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s}
    .ck:active{transform:scale(.88)}
    .ck-box{width:27px;height:27px;border-radius:8px;border:2px solid var(--lbl3);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;background:var(--card);transition:all .16s}
    .ck-cap{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;color:var(--lbl3);white-space:nowrap}
    .ck.on .ck-box{background:var(--verde);border-color:var(--verde)}
    .ck.on .ck-cap{color:var(--verde)}
    .item-body{flex:1;min-width:0}
    .label{font-size:14.5px;font-weight:500;color:var(--lbl);line-height:1.3;transition:color .15s}
    .item.done .label{color:var(--lbl3);text-decoration:line-through;text-decoration-color:var(--lbl3)}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
    .resp{font-size:9.5px;font-weight:700;color:var(--slate);background:rgba(91,122,140,.1);border-radius:6px;padding:2px 7px;white-space:nowrap}
    .obs{font-size:10.5px;color:var(--lbl3);font-style:italic;line-height:1.35;margin-top:4px}

    .edit-btn2{border:1.5px solid var(--sep);background:rgba(26,22,16,.05);color:var(--lbl2);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0;transition:all .18s}
    .del-btn{flex-shrink:0;width:40px;height:40px;border:none;background:rgba(139,61,46,.1);color:var(--red);border-radius:9px;font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s}
    .del-btn:active{transform:scale(.88)}
    .add-btn{width:100%;margin:2px 0 4px;padding:11px;border:1.5px dashed var(--zc,var(--lbl3));background:transparent;color:var(--zc,var(--lbl2));border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:.2px;opacity:.85}
    .add-btn:active{transform:scale(.99)}

    .edit-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
    .edit-inp{width:100%;font-family:inherit;font-size:14.5px;font-weight:500;color:var(--lbl);background:var(--bg);border:1px solid var(--sep);border-radius:9px;padding:10px 11px;-webkit-tap-highlight-color:transparent}
    .edit-inp:focus{outline:none;border-color:var(--zc,var(--verde));background:var(--card)}
    .edit-inp.sm{font-size:12px;padding:8px 10px}
    body.editmode .item{padding:8px 10px}

    @media(max-width:480px){
      .topbar-s{display:none}
      .zone-hd{top:70px}
    }
  </style>
</head>
<body>

<div class="stickytop">
  <div class="topbar">
    <a class="topbar-back" href="planeamento-cbr.html" title="Voltar ao Planeamento">‹ Planeamento</a>
    <div style="flex:1;min-width:0;text-align:center">
      <div class="topbar-t">🏗️ Fim de Obra</div>
      <div class="topbar-s" id="sub">0 de 0 itens concluídos</div>
    </div>
    <div class="topbar-r">
      <button class="edit-btn" id="edit-btn" title="Editar lista">✏️ Editar</button>
      <span id="sync-dot" title="A carregar…" style="width:8px;height:8px;border-radius:50%;background:#8C9198;display:inline-block;flex-shrink:0;transition:background .4s"></span>
      <div class="topbar-pct" id="pct">0%</div>
    </div>
  </div>
  <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="body" id="body"></div>

<script>
(function(){
  function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* ── DADOS — CE_checklistconclusaoobra_2.xlsx (Coimbra Editora · Conclusão de Obra e Início de Exploração) ── */
  const OB_DEFAULT=[
    {z:'Obra por Executar / Pendências',c:'#8B3D2E',items:[
      {t:'Instalação dos painéis fotovoltaicos',r:'',o:'opção1- cumprir projeto com inclusão dos passadiços e linhas de vida · opção2- definir data limite para decisão das escadas · opção3- Aceitar solução e custo da proposta A.pimenta'},
      {t:'Portões/Grade no logradouro voltado à AutoIndustrial',r:'',o:'1- definição portão Rua do Arnado · 2- Gradeamento no topo voltado ao estacionamento Continente'},
      {t:'Molas de braço nas portas grandes',r:'A.Pimenta/Critical',o:''},
      {t:'Tratamento acústico da sala multiusos',r:'',o:'1- definição baflles (Arquitetos) · 2- contratar fornecedor (Reunia/Critical)'},
      {t:'Facilitar Entrada de cabos no PT (posto de transformação)',r:'A.Pimenta',o:''},
    ]},
    {z:'Vistorias e Aceitação Técnica',c:'#5B7A8C',items:[
      {t:'Vistoria final com a fiscalização/projetista de cada especialidade',r:'',o:''},
      {t:'Auto de receção provisória da obra (dono de obra + empreiteiro)',r:'',o:''},
      {t:'Resolução da lista de defeitos (punch list)',r:'',o:''},
      {t:'Testes e comissionamento de instalações (elétrica, AVAC, águas, esgotos, gás, elevadores, incêndio)',r:'',o:''},
      {t:'Ensaios obrigatórios (isolamento elétrico, estanquidade, pressão de redes, etc.)',r:'',o:''},
      {t:'Entrega de telas finais (as-built) de todas as especialidades',r:'',o:''},
    ]},
    {z:'Licenciamento e Documentação Legal',c:'#809751',items:[
      {t:'Processo de alterações no decurso da Obra',r:'',o:''},
      {t:'Submissão projeto de alterações Arquitetura',r:'',o:''},
      {t:'Submissão projeto de alterações Estrutura',r:'',o:''},
      {t:'Pedidos de dispensa das outras especialidades',r:'',o:''},
      {t:'Requerimento de autorização de utilização à Câmara Municipal',r:'',o:''},
      {t:'Termos de responsabilidade dos técnicos',r:'',o:''},
      {t:'Certificado Energético (SCE) atualizado',r:'',o:''},
      {t:'MAP\'s Segurança Contra Incêndio (SCIE)',r:'',o:''},
      {t:'Ensaios Acústicos',r:'',o:''},
      {t:'Certificado Elevadores',r:'',o:''},
      {t:'Autorização de utilização',r:'',o:''},
    ]},
    {z:'Ligações a Redes e Serviços',c:'#B0622D',items:[
      {t:'Ligação definitiva de eletricidade',r:'',o:''},
      {t:'Ligação definitiva de água e saneamento',r:'',o:''},
      {t:'Ligação de gás (se aplicável)',r:'',o:''},
      {t:'Instalação e ativação de telecomunicações/internet',r:'',o:''},
      {t:'Contratos de manutenção (elevadores, AVAC, elétrica, extintores)',r:'',o:''},
    ]},
    {z:'Seguros',c:'#6C7FA8',items:[
      {t:'Cancelamento do seguro de obra (CAR/EAR)',r:'',o:''},
      {t:'Contratação de seguro multirriscos do edifício',r:'',o:''},
      {t:'Seguro de responsabilidade civil de exploração',r:'',o:''},
      {t:'Seguro contra incêndio',r:'',o:''},
    ]},
    {z:'Segurança e Equipamentos',c:'#A0524A',items:[
      {t:'Extintores, bocas de incêndio e sinalética instalados e certificados',r:'',o:''},
      {t:'Plano de emergência/evacuação elaborado',r:'',o:''},
      {t:'Sinalética de segurança e acessibilidade colocada',r:'',o:''},
    ]},
    {z:'Limpeza e Preparação do Espaço',c:'#4C8C86',items:[
      {t:'Limpeza final de obra (fina)',r:'',o:''},
      {t:'Remoção de entulhos, materiais sobrantes e equipamentos de estaleiro',r:'',o:''},
      {t:'Desmontagem do estaleiro (vedações, contentores, casas de apoio)',r:'',o:''},
      {t:'Reposição de espaços exteriores/arranjos exteriores',r:'',o:''},
    ]},
    {z:'Aspetos Financeiros e Contratuais',c:'#C79A3A',items:[
      {t:'Conta final de obra e fecho de contas com empreiteiro(s)',r:'',o:''},
      {t:'Libertação/gestão de retenções e garantias bancárias',r:'',o:''},
      {t:'Faturação e pagamentos finais',r:'',o:''},
      {t:'Arquivo da documentação contratual e financeira',r:'',o:''},
    ]},
    {z:'Garantias e Manuais',c:'#8F7A52',items:[
      {t:'Manuais de utilização e manutenção de equipamentos',r:'',o:''},
      {t:'Termos de garantia de obra e de equipamentos instalados',r:'',o:''},
      {t:'Contactos de assistência técnica/pós-venda',r:'',o:''},
    ]},
    {z:'Recursos Humanos',c:'#6FA098',items:[
      {t:'Recrutamento e formação da equipa de exploração',r:'',o:''},
      {t:'Definição de procedimentos operacionais',r:'',o:''},
      {t:'Formação em segurança e emergência para colaboradores',r:'',o:''},
    ]},
    {z:'Abertura / Início de Exploração',c:'#8E6FA0',items:[
      {t:'Licenças específicas de atividade (comércio, restauração, alojamento, indústria, etc.)',r:'',o:''},
      {t:'Comunicação prévia/autorização de exploração junto das entidades competentes',r:'',o:''},
      {t:'Definição de data de abertura e plano de lançamento/marketing',r:'',o:''},
      {t:'Testes operacionais finais (simulação de funcionamento)',r:'',o:''},
    ]},
  ];

  /* ── STATE — GitHub-backed (ficheiro próprio, partilhado entre utilizadores) ── */
  const _GH_REPO  = 'iamvalerio/cbr-planeamento';
  const _GH_TOKEN=String.fromCharCode(...[103,104,118,107,113,103,89,119,105,125,85,58,61,78,77,69,35,35,80,74,36,125,97,66,40,86,110,94,115,74,118,117,110,126,114,21,72,64,73,116,73,76,66,66,68,75,106,27,125,84,93,74,122,88,125,90,125,0,124,9,8,92,85,6,10,118,5,43,50,17,118,46,58,26,0,17,124,27,10,0,4,16,102,5,30,103,99,103,27,55,108,12,59].map((c,i)=>c^i));
  const _GH_API   = `https://api.github.com/repos/${_GH_REPO}/contents/state-obra.json`;

  let _state={obcheck:{},obzones:null};
  let _dirty=false,_syncTimer=null,_writeInProgress=false,_writeQueued=false;

  async function _ghRead(){
    const r=await fetch(_GH_API,{headers:{'Authorization':`Bearer ${_GH_TOKEN}`,'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)return null;
    try{
      const meta=await r.json();
      const decoded=decodeURIComponent(escape(atob(meta.content.replace(/\s/g,''))));
      return JSON.parse(decoded);
    }catch{return null;}
  }
  async function _ghWrite(state){
    const metaR=await fetch(_GH_API,{headers:{'Authorization':`Bearer ${_GH_TOKEN}`,'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!metaR.ok)throw new Error('read failed');
    const meta=await metaR.json();
    const bytes=new TextEncoder().encode(JSON.stringify(state,null,2));
    const b64=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
    const putR=await fetch(_GH_API,{
      method:'PUT',
      headers:{'Authorization':`Bearer ${_GH_TOKEN}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'obra update',content:b64,sha:meta.sha})
    });
    if(!putR.ok)throw new Error('write failed');
  }
  async function _flush(){
    if(_writeInProgress){_writeQueued=true;return;}
    _writeInProgress=true;
    try{ await _ghWrite(_state); _dirty=false; _setSyncDot('ok'); }
    catch(e){ _setSyncDot('err'); setTimeout(_flush,4000); }
    finally{ _writeInProgress=false; if(_writeQueued){_writeQueued=false;_flush();} }
  }
  function _push(){ _dirty=true; _setSyncDot('saving'); clearTimeout(_syncTimer); _syncTimer=setTimeout(_flush,800); }
  function _setSyncDot(st){
    const d=document.getElementById('sync-dot'); if(!d)return;
    const col={ok:'#809751',saving:'#B0622D',err:'#8B3D2E',load:'#8C9198'};
    const lbl={ok:'Sincronizado',saving:'A guardar…',err:'Erro de ligação',load:'A carregar…'};
    d.style.background=col[st]||'#8E8E93'; d.title=lbl[st]||'';
  }

  let editMode=false;

  function newId(){ return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function seed(){
    if(!_state.obcheck||typeof _state.obcheck!=='object')_state.obcheck={};
    if(!Array.isArray(_state.obzones)){
      _state.obzones=OB_DEFAULT.map(z=>({
        z:z.z, c:z.c,
        items:z.items.map(it=>{
          const id=newId();
          _state.obcheck[id]={d:0,r:it.r||'',o:it.o||''};
          return {id,t:it.t};
        })
      }));
      _push();
    }
  }
  function zones(){ seed(); return _state.obzones; }
  function chkState(id){ return _state.obcheck[id]||{d:0,r:'',o:''}; }
  function setDone(id,v){ const m=_state.obcheck; if(!m[id])m[id]={d:0,r:'',o:''}; m[id].d=v?1:0; _push(); }
  function setField(id,k,v){ const m=_state.obcheck; if(!m[id])m[id]={d:0,r:'',o:''}; m[id][k]=v; _push(); }

  function zoneStats(zi){
    const z=zones()[zi]; let d=0;
    z.items.forEach(it=>{ if(chkState(it.id).d)d++; });
    return {d,total:z.items.length};
  }
  function globalStats(){
    let d=0,total=0;
    zones().forEach((_,zi)=>{const st=zoneStats(zi); d+=st.d; total+=st.total;});
    return {d,total};
  }
  function zoneDone(st){ return st.total>0 && st.d===st.total; }
  function updateProgress(){
    const g=globalStats();
    const p=g.total?Math.round(g.d/g.total*100):0;
    document.getElementById('pct').textContent=p+'%';
    document.getElementById('progress-fill').style.width=p+'%';
    document.getElementById('sub').textContent=`${g.d} de ${g.total} itens concluídos`;
  }
  function render(){
    const body=document.getElementById('body');
    body.innerHTML='';
    zones().forEach((z,zi)=>{
      const st=zoneStats(zi);
      const zone=document.createElement('div');
      zone.className='zone'+(zoneDone(st)?' zdone':'');
      zone.dataset.zi=zi;
      zone.style.setProperty('--zc',z.c);
      const zp=st.total?Math.round(st.d/st.total*100):0;
      const hd=document.createElement('div');hd.className='zone-hd';
      hd.innerHTML=`<span class="zone-dot"></span><span class="zone-name">${esc(z.z)}</span><span class="zone-count">✅${st.d}/${st.total}</span><span class="zone-pct">${zp}%</span>`;
      zone.appendChild(hd);
      z.items.forEach(item=>{
        const s=chkState(item.id);
        const it=document.createElement('div');
        it.className='item'+(s.d?' done':'');
        it.dataset.id=item.id;
        if(editMode){
          it.innerHTML=
            `<div class="edit-col">`+
              `<input class="edit-inp" data-id="${item.id}" data-f="t" value="${esc(item.t)}" placeholder="Descrição do item…">`+
              `<input class="edit-inp sm" data-id="${item.id}" data-f="r" value="${esc(s.r)}" placeholder="Responsável…">`+
              `<input class="edit-inp sm" data-id="${item.id}" data-f="o" value="${esc(s.o)}" placeholder="Observações…">`+
            `</div>`+
            `<button class="del-btn" data-id="${item.id}" title="Apagar item">🗑</button>`;
        }else{
          it.innerHTML=
            `<div class="checks">`+
              `<div class="ck${s.d?' on':''}" data-id="${item.id}"><div class="ck-box">${s.d?'✓':''}</div><div class="ck-cap">Concluído</div></div>`+
            `</div>`+
            `<div class="item-body">`+
              `<div class="label">${esc(item.t)}</div>`+
              (s.r?`<div class="meta"><span class="resp">👤 ${esc(s.r)}</span></div>`:'')+
              (s.o?`<div class="obs">${esc(s.o)}</div>`:'')+
            `</div>`;
        }
        zone.appendChild(it);
      });
      if(editMode){
        const add=document.createElement('button');
        add.className='add-btn'; add.dataset.zi=zi; add.textContent='＋ Adicionar item';
        zone.appendChild(add);
      }
      body.appendChild(zone);
    });
    updateProgress();
  }
  function setEdit(on){
    editMode=on;
    const b=document.getElementById('edit-btn');
    b.classList.toggle('on',on); b.textContent=on?'✓ Concluir':'✏️ Editar';
    document.body.classList.toggle('editmode',on);
    render();
  }

  document.getElementById('edit-btn').addEventListener('click',()=>setEdit(!editMode));

  document.getElementById('body').addEventListener('click',e=>{
    const del=e.target.closest('.del-btn');
    if(del){
      const id=del.dataset.id;
      for(const z of zones()){const ix=z.items.findIndex(x=>x.id===id); if(ix>=0){z.items.splice(ix,1);break;}}
      delete _state.obcheck[id]; _push(); render();
      if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
      return;
    }
    const add=e.target.closest('.add-btn');
    if(add){
      const zi=+add.dataset.zi, id=newId();
      _state.obcheck[id]={d:0,r:'',o:''};
      zones()[zi].items.push({id,t:''}); _push(); render();
      const inp=document.querySelector(`.edit-inp[data-id="${id}"][data-f="t"]`);
      if(inp)inp.focus();
      return;
    }
    const ck=e.target.closest('.ck'); if(!ck||editMode)return;
    const id=ck.dataset.id, on=!chkState(id).d;
    setDone(id,on);
    ck.classList.toggle('on',on);
    ck.querySelector('.ck-box').textContent=on?'✓':'';
    ck.closest('.item').classList.toggle('done',on);
    const zone=ck.closest('.zone'), st=zoneStats(+zone.dataset.zi);
    zone.querySelector('.zone-count').textContent=`✅${st.d}/${st.total}`;
    zone.querySelector('.zone-pct').textContent=(st.total?Math.round(st.d/st.total*100):0)+'%';
    zone.classList.toggle('zdone',zoneDone(st));
    updateProgress();
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  });
  document.getElementById('body').addEventListener('input',e=>{
    const inp=e.target.closest('.edit-inp'); if(!inp)return;
    const id=inp.dataset.id, f=inp.dataset.f;
    if(f==='t'){
      for(const z of zones()){const item=z.items.find(x=>x.id===id); if(item){item.t=inp.value;break;}}
    }else{
      setField(id,f,inp.value);
    }
    _push();
  });

  /* ── ASYNC INIT — carrega estado do GitHub, renderiza, depois faz polling ── */
  (async()=>{
    _setSyncDot('load');
    try{
      const d=await _ghRead();
      if(d){
        _state=d;
        if(!_state.obcheck||typeof _state.obcheck!=='object')_state.obcheck={};
      }
    }catch(e){}
    try{ render(); }catch(e){ console.error('render error',e); }
    _setSyncDot('ok');

    setInterval(async()=>{
      if(_dirty)return;
      try{
        const d=await _ghRead();
        if(!d)return;
        if(!d.obcheck||typeof d.obcheck!=='object')d.obcheck={};
        if(JSON.stringify(d)!==JSON.stringify(_state)){
          _state=d;
          render();
          _setSyncDot('ok');
        }
      }catch(e){}
    },30000);
  })();
})();
</script>
</body>
</html>
