<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fim de Obra | CBR Editora</title>
  <style>
    :root{
      /* ── Paleta do Projecto ── */
      --verde:#809751;
      --tijolo:#B0622D;
      --madeira:#C4A882;
      --betao:#8C9198;
      --slate:#5B7A8C;
      --red:#8B3D2E;
      /* ── Superfícies ── */
      --bg:#EDE9E3;
      --card:#FFFFFF;
      /* ── Texto (base quente) ── */
      --lbl:rgba(26,22,16,1);
      --lbl2:rgba(26,22,16,.58);
      --lbl3:rgba(26,22,16,.28);
      --sep:rgba(26,22,16,.1);
      /* ── Sombras quentes ── */
      --shadow-sm:0 1px 3px rgba(60,40,16,.08),0 1px 2px rgba(60,40,16,.05);
      --hdh:96px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{overflow-x:hidden;max-width:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--lbl);-webkit-font-smoothing:antialiased}

    /* ── TOP BAR ── */
    .stickytop{position:sticky;top:0;z-index:300;background:rgba(237,233,227,.94);backdrop-filter:saturate(200%) blur(24px);-webkit-backdrop-filter:saturate(200%) blur(24px);border-bottom:0.5px solid var(--sep);padding-top:env(safe-area-inset-top,0px)}
    .tb-row{padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .tb-row1{padding-bottom:5px}
    .tb-row2{padding-top:0}
    .topbar-back{font-size:12.5px;font-weight:600;color:var(--lbl2);text-decoration:none;display:flex;align-items:center;gap:3px;flex-shrink:0;padding:6px 2px;-webkit-tap-highlight-color:transparent}
    .topbar-back:active{opacity:.5}
    .topbar-r1{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .topbar-pct{font-size:19px;font-weight:700;color:var(--verde);line-height:1;min-width:38px;text-align:right}
    .topbar-titles{flex:1;min-width:0}
    .topbar-t{font-size:16px;font-weight:700;letter-spacing:-.2px;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar-s{font-size:11px;color:var(--lbl2);margin-top:1px;font-weight:500;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .edit-btn{border:1.5px solid var(--sep);background:rgba(26,22,16,.05);color:var(--lbl2);border-radius:20px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:all .18s;flex-shrink:0;min-height:36px}
    .edit-btn.on{background:var(--verde);color:#fff;border-color:transparent}
    .edit-btn:active{transform:scale(.95)}
    .progress{height:4px;background:rgba(128,151,81,.15)}
    .progress-fill{height:100%;background:var(--verde);width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}

    /* ── BODY / ZONES ── */
    .body{max-width:720px;margin:0 auto;padding:14px 10px calc(60px + env(safe-area-inset-bottom,0px))}
    .zone{margin-top:20px}
    .zone:first-child{margin-top:8px}
    .zone-hd{display:flex;align-items:center;gap:8px;padding:7px 6px 8px;position:sticky;top:var(--hdh);background:var(--bg);z-index:2}
    .zone-dot{width:11px;height:11px;border-radius:4px;background:var(--zc,#bbb);flex-shrink:0}
    .zone-name{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--zc,var(--lbl2));flex:1;min-width:0;line-height:1.3}
    .zone-count{font-size:10.5px;font-weight:700;color:var(--lbl2);background:rgba(26,22,16,.05);border-radius:99px;padding:3px 9px;flex-shrink:0;white-space:nowrap}
    .zone-pct{font-size:11px;font-weight:800;color:#fff;background:var(--zc,var(--verde));border-radius:99px;padding:3px 8px;flex-shrink:0;min-width:34px;text-align:center}

    .item{background:var(--card);border-radius:14px;border-left:4px solid var(--zc,transparent);margin-bottom:8px;padding:13px;box-shadow:var(--shadow-sm)}
    .item-top{display:flex;align-items:flex-start;gap:12px}
    .checks{display:flex;flex-shrink:0}
    .ck{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s;padding:2px;min-width:44px}
    .ck:active{transform:scale(.9)}
    .ck-box{width:28px;height:28px;border-radius:8px;border:2px solid var(--lbl3);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;background:var(--card);transition:all .16s}
    .ck-cap{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;color:var(--lbl3);white-space:nowrap}
    .ck.on .ck-box{background:var(--verde);border-color:var(--verde)}
    .ck.on .ck-cap{color:var(--verde)}
    .item-body{flex:1;min-width:0}
    .label{font-size:15px;font-weight:500;color:var(--lbl);line-height:1.35;word-wrap:break-word}
    .item.done .label{color:var(--lbl3);text-decoration:line-through;text-decoration-color:var(--lbl3)}
    .meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px}
    .resp{font-size:10px;font-weight:700;color:var(--slate);background:rgba(91,122,140,.1);border-radius:6px;padding:4px 8px;white-space:nowrap}
    .obs{font-size:11px;color:var(--lbl3);font-style:italic;line-height:1.4;margin-top:6px}

    /* Owner select */
    .owner-wrap{position:relative;display:inline-flex;flex-shrink:0}
    .owner-wrap::after{content:'▾';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:8px;color:var(--oc,var(--lbl3));pointer-events:none;opacity:.8}
    .owner-select{appearance:none;-webkit-appearance:none;-moz-appearance:none;border:1.5px solid var(--oc,var(--sep));background:var(--card);color:var(--oc,var(--lbl2));font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 22px 6px 9px;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:30px;max-width:132px;text-overflow:ellipsis}
    .owner-select:focus{outline:none}

    .del-btn{flex-shrink:0;width:40px;height:40px;border:none;background:rgba(139,61,46,.1);color:var(--red);border-radius:9px;font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s}
    .del-btn:active{transform:scale(.88)}
    .add-btn{width:100%;margin:2px 0 4px;padding:12px;border:1.5px dashed var(--zc,var(--lbl3));background:transparent;color:var(--zc,var(--lbl2));border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:.2px;opacity:.85;min-height:44px}
    .add-btn:active{transform:scale(.99)}

    .edit-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
    .edit-inp{width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--lbl);background:var(--bg);border:1px solid var(--sep);border-radius:9px;padding:11px;-webkit-tap-highlight-color:transparent}
    .edit-inp:focus{outline:none;border-color:var(--zc,var(--verde));background:var(--card)}
    .edit-inp.sm{font-size:14.5px;padding:9px 11px}
    .item.editing{padding:11px}
    .edit-top-row{display:flex;gap:8px;align-items:flex-start}

    /* ── SUB-AÇÕES (checklist dentro do item) ── */
    .subs{margin-top:11px;padding-top:10px;border-top:1px dashed var(--sep)}
    .subs-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
    .subs-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--lbl3)}
    .subs-count{font-size:9.5px;font-weight:800;color:var(--lbl2);background:rgba(26,22,16,.05);border-radius:99px;padding:2px 8px}
    .subs-count.all{color:#fff;background:var(--verde)}
    .subs-list{display:flex;flex-direction:column;gap:1px}
    .sub-item{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:9px}
    .sub-item:active{background:rgba(26,22,16,.04)}
    .sub-ck-box{width:21px;height:21px;border-radius:6px;border:2px solid var(--lbl3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--card);margin-top:1px;transition:all .16s}
    .sub-item.on .sub-ck-box{background:var(--verde);border-color:var(--verde)}
    .sub-label{font-size:13.5px;color:var(--lbl);line-height:1.4;flex:1;min-width:0;padding-top:2px}
    .sub-item.on .sub-label{color:var(--lbl3);text-decoration:line-through}
    .sub-resp{font-size:9px;font-weight:700;color:var(--slate);background:rgba(91,122,140,.1);border-radius:5px;padding:2px 6px;white-space:nowrap;flex-shrink:0;margin-top:3px}

    .sub-edit-row{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;align-items:center}
    .sub-edit-row .edit-inp{flex:1 1 140px;min-width:0}
    .sub-del-btn{flex-shrink:0;width:34px;height:34px;border:none;background:rgba(139,61,46,.1);color:var(--red);border-radius:8px;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .add-sub-btn{width:100%;margin-top:4px;padding:9px;border:1.5px dashed var(--sep);background:transparent;color:var(--lbl2);border-radius:10px;font-size:11.5px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:38px}
    .add-sub-btn:active{transform:scale(.98)}

    /* ── OPÇÕES (escolha única, não conta para a % — apenas decisão) ── */
    .opt-item{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:9px}
    .opt-item:active{background:rgba(26,22,16,.04)}
    .opt-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--lbl3);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .16s}
    .opt-radio::after{content:'';width:9px;height:9px;border-radius:50%;background:transparent;transition:background .16s}
    .opt-item.sel .opt-radio{border-color:var(--verde)}
    .opt-item.sel .opt-radio::after{background:var(--verde)}
    .opt-label{font-size:13.5px;color:var(--lbl);line-height:1.4;flex:1;min-width:0;padding-top:2px}
    .opt-item.sel .opt-label{font-weight:700}
    .opt-resp{font-size:9px;font-weight:700;color:var(--slate);background:rgba(91,122,140,.1);border-radius:5px;padding:2px 6px;white-space:nowrap;flex-shrink:0;margin-top:3px}

    @media(max-width:480px){
      .topbar-s{max-width:52vw}
      .owner-select{max-width:104px}
      .body{padding-left:8px;padding-right:8px}
      .item{padding:11px}
    }
    @media(max-width:360px){
      .owner-select{max-width:88px;font-size:11px}
      .resp{font-size:9px;padding:3px 6px}
    }
  </style>
</head>
<body>

<div class="stickytop">
  <div class="tb-row tb-row1">
    <a class="topbar-back" href="planeamento-cbr.html" title="Voltar ao Planeamento">‹ Planeamento</a>
    <div class="topbar-r1">
      <span id="sync-dot" title="A carregar…" style="width:8px;height:8px;border-radius:50%;background:#8C9198;display:inline-block;flex-shrink:0;transition:background .4s"></span>
      <div class="topbar-pct" id="pct">0%</div>
    </div>
  </div>
  <div class="tb-row tb-row2">
    <div class="topbar-titles">
      <div class="topbar-t">🏗️ Fim de Obra</div>
      <div class="topbar-s" id="sub">0 de 0 itens concluídos</div>
    </div>
    <button class="edit-btn" id="edit-btn" title="Editar lista">✏️ Editar</button>
  </div>
  <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="body" id="body"></div>

<script>
(function(){
  function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  const OWNERS=[
    {k:'valerio',n:'Valério',c:'#809751'},
    {k:'artur',  n:'Artur',  c:'#B0622D'},
    {k:'joao',   n:'João',   c:'#5B7A8C'},
  ];
  function ownerColor(k){ const o=OWNERS.find(x=>x.k===k); return o?o.c:''; }
  function ownerSelectHtml(id,val){
    const oc=ownerColor(val);
    const opts=`<option value=""${!val?' selected':''}>👤 Atribuir</option>`+
      OWNERS.map(o=>`<option value="${o.k}"${val===o.k?' selected':''}>${o.n}</option>`).join('');
    return `<span class="owner-wrap" style="${oc?`--oc:${oc}`:''}"><select class="owner-select" data-id="${id}" style="${oc?`--oc:${oc}`:''}">${opts}</select></span>`;
  }

  /* ── DADOS — CE_checklistconclusaoobra_2.xlsx (Coimbra Editora · Conclusão de Obra e Início de Exploração) ── */
  const OB_DEFAULT=[
    {z:'Obra por Executar / Pendências',c:'#8B3D2E',items:[
      {t:'Instalação dos painéis fotovoltaicos',r:'',kind:'choice',subs:[{t:'Opção 1 – Cumprir projeto com inclusão dos passadiços e linhas de vida',r:''},{t:'Opção 2 – Definir data limite para decisão das escadas',r:''},{t:'Opção 3 – Aceitar solução e custo da proposta A.Pimenta',r:''}]},
      {t:'Portões/Grade no logradouro voltado à AutoIndustrial',r:'',subs:[{t:'1 – Definição portão Rua do Arnado',r:''},{t:'2 – Gradeamento no topo voltado ao estacionamento Continente',r:''}]},
      {t:'Molas de braço nas portas grandes',r:'A.Pimenta/Critical'},
      {t:'Tratamento acústico da sala multiusos',r:'',subs:[{t:'1 – Definição baflles',r:'Arquitetos'},{t:'2 – Contratar fornecedor',r:'Reunia/Critical'}]},
      {t:'Facilitar Entrada de cabos no PT (posto de transformação)',r:'A.Pimenta'},
    ]},
    {z:'Vistorias e Aceitação Técnica',c:'#5B7A8C',items:[
      {t:'Vistoria final com a fiscalização/projetista de cada especialidade',r:''},
      {t:'Auto de receção provisória da obra (dono de obra + empreiteiro)',r:''},
      {t:'Resolução da lista de defeitos (punch list)',r:''},
      {t:'Testes e comissionamento de instalações (elétrica, AVAC, águas, esgotos, gás, elevadores, incêndio)',r:''},
      {t:'Ensaios obrigatórios (isolamento elétrico, estanquidade, pressão de redes, etc.)',r:''},
      {t:'Entrega de telas finais (as-built) de todas as especialidades',r:''},
    ]},
    {z:'Licenciamento e Documentação Legal',c:'#809751',items:[
      {t:'Processo de alterações no decurso da Obra',r:''},
      {t:'Submissão projeto de alterações Arquitetura',r:''},
      {t:'Submissão projeto de alterações Estrutura',r:''},
      {t:'Pedidos de dispensa das outras especialidades',r:''},
      {t:'Requerimento de autorização de utilização à Câmara Municipal',r:''},
      {t:'Termos de responsabilidade dos técnicos',r:''},
      {t:'Certificado Energético (SCE) atualizado',r:''},
      {t:'MAP\'s Segurança Contra Incêndio (SCIE)',r:''},
      {t:'Ensaios Acústicos',r:''},
      {t:'Certificado Elevadores',r:''},
      {t:'Autorização de utilização',r:''},
    ]},
    {z:'Ligações a Redes e Serviços',c:'#B0622D',items:[
      {t:'Ligação definitiva de eletricidade',r:''},
      {t:'Ligação definitiva de água e saneamento',r:''},
      {t:'Ligação de gás (se aplicável)',r:''},
      {t:'Instalação e ativação de telecomunicações/internet',r:''},
      {t:'Contratos de manutenção (elevadores, AVAC, elétrica, extintores)',r:''},
    ]},
    {z:'Seguros',c:'#6C7FA8',items:[
      {t:'Cancelamento do seguro de obra (CAR/EAR)',r:''},
      {t:'Contratação de seguro multirriscos do edifício',r:''},
      {t:'Seguro de responsabilidade civil de exploração',r:''},
      {t:'Seguro contra incêndio',r:''},
    ]},
    {z:'Segurança e Equipamentos',c:'#A0524A',items:[
      {t:'Extintores, bocas de incêndio e sinalética instalados e certificados',r:''},
      {t:'Plano de emergência/evacuação elaborado',r:''},
      {t:'Sinalética de segurança e acessibilidade colocada',r:''},
    ]},
    {z:'Limpeza e Preparação do Espaço',c:'#4C8C86',items:[
      {t:'Limpeza final de obra (fina)',r:''},
      {t:'Remoção de entulhos, materiais sobrantes e equipamentos de estaleiro',r:''},
      {t:'Desmontagem do estaleiro (vedações, contentores, casas de apoio)',r:''},
      {t:'Reposição de espaços exteriores/arranjos exteriores',r:''},
    ]},
    {z:'Aspetos Financeiros e Contratuais',c:'#C79A3A',items:[
      {t:'Conta final de obra e fecho de contas com empreiteiro(s)',r:''},
      {t:'Libertação/gestão de retenções e garantias bancárias',r:''},
      {t:'Faturação e pagamentos finais',r:''},
      {t:'Arquivo da documentação contratual e financeira',r:''},
    ]},
    {z:'Garantias e Manuais',c:'#8F7A52',items:[
      {t:'Manuais de utilização e manutenção de equipamentos',r:''},
      {t:'Termos de garantia de obra e de equipamentos instalados',r:''},
      {t:'Contactos de assistência técnica/pós-venda',r:''},
    ]},
    {z:'Recursos Humanos',c:'#6FA098',items:[
      {t:'Recrutamento e formação da equipa de exploração',r:''},
      {t:'Definição de procedimentos operacionais',r:''},
      {t:'Formação em segurança e emergência para colaboradores',r:''},
    ]},
    {z:'Abertura / Início de Exploração',c:'#8E6FA0',items:[
      {t:'Licenças específicas de atividade (comércio, restauração, alojamento, indústria, etc.)',r:''},
      {t:'Comunicação prévia/autorização de exploração junto das entidades competentes',r:''},
      {t:'Definição de data de abertura e plano de lançamento/marketing',r:''},
      {t:'Testes operacionais finais (simulação de funcionamento)',r:''},
    ]},
  ];

  /* ── STATE — GitHub-backed (ficheiro próprio, partilhado entre utilizadores) ── */
  const _GH_REPO  = 'iamvalerio/cbr-planeamento';
  const _GH_TOKEN=String.fromCharCode(...[103,104,118,107,113,103,89,119,105,125,85,58,61,78,77,69,35,35,80,74,36,125,97,66,40,86,110,94,115,74,118,117,110,126,114,21,72,64,73,116,73,76,66,66,68,75,106,27,125,84,93,74,122,88,125,90,125,0,124,9,8,92,85,6,10,118,5,43,50,17,118,46,58,26,0,17,124,27,10,0,4,16,102,5,30,103,99,103,27,55,108,12,59].map((c,i)=>c^i));
  const _GH_API   = `https://api.github.com/repos/${_GH_REPO}/contents/state-obra.json`;

  let _state={obcheck:{},obzones:null};
  let _dirty=false,_syncTimer=null,_writeInProgress=false,_writeQueued=false;

  async function _ghRead(){
    const r=await fetch(_GH_API,{headers:{'Authorization':`Bearer ${_GH_TOKEN}`,'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)return null;
    try{
      const meta=await r.json();
      const decoded=decodeURIComponent(escape(atob(meta.content.replace(/\s/g,''))));
      return JSON.parse(decoded);
    }catch{return null;}
  }
  async function _ghWrite(state){
    const metaR=await fetch(_GH_API,{headers:{'Authorization':`Bearer ${_GH_TOKEN}`,'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!metaR.ok)throw new Error('read failed');
    const meta=await metaR.json();
    const bytes=new TextEncoder().encode(JSON.stringify(state,null,2));
    const b64=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
    const putR=await fetch(_GH_API,{
      method:'PUT',
      headers:{'Authorization':`Bearer ${_GH_TOKEN}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'obra update',content:b64,sha:meta.sha})
    });
    if(!putR.ok)throw new Error('write failed');
  }
  async function _flush(){
    if(_writeInProgress){_writeQueued=true;return;}
    _writeInProgress=true;
    try{ await _ghWrite(_state); _dirty=false; _setSyncDot('ok'); }
    catch(e){ _setSyncDot('err'); setTimeout(_flush,4000); }
    finally{ _writeInProgress=false; if(_writeQueued){_writeQueued=false;_flush();} }
  }
  function _push(){ _dirty=true; _setSyncDot('saving'); clearTimeout(_syncTimer); _syncTimer=setTimeout(_flush,800); }
  function _setSyncDot(st){
    const d=document.getElementById('sync-dot'); if(!d)return;
    const col={ok:'#809751',saving:'#B0622D',err:'#8B3D2E',load:'#8C9198'};
    const lbl={ok:'Sincronizado',saving:'A guardar…',err:'Erro de ligação',load:'A carregar…'};
    d.style.background=col[st]||'#8E8E93'; d.title=lbl[st]||'';
  }

  let editMode=false;
  const BLANK=()=>({d:0,r:'',o:'',owner:'',choice:''});

  function newId(){ return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function seed(){
    if(!_state.obcheck||typeof _state.obcheck!=='object')_state.obcheck={};
    if(!Array.isArray(_state.obzones)){
      _state.obzones=OB_DEFAULT.map(z=>({
        z:z.z, c:z.c,
        items:z.items.map(it=>{
          const id=newId();
          _state.obcheck[id]=BLANK(); _state.obcheck[id].r=it.r||'';
          const subs=(it.subs||[]).map(sub=>{
            const sid=newId();
            _state.obcheck[sid]=BLANK(); _state.obcheck[sid].r=sub.r||'';
            return {id:sid,t:sub.t};
          });
          const item={id,t:it.t,subs};
          if(it.kind)item.kind=it.kind;
          return item;
        })
      }));
      _push();
    }
  }
  function migrate(){
    // repara estado semeado antes desta versão (sem subs/owner/kind), sem perder o que já estava marcado
    const tmplByTitle={};
    OB_DEFAULT.forEach(z=>z.items.forEach(it=>{ tmplByTitle[it.t]=it; }));
    let changed=false;
    (_state.obzones||[]).forEach(z=>{
      z.items.forEach(item=>{
        const tmpl=tmplByTitle[item.t];
        if(tmpl && tmpl.kind && item.kind!==tmpl.kind){ item.kind=tmpl.kind; changed=true; }
        if(!Array.isArray(item.subs)){
          const subsTmpl=(tmpl&&tmpl.subs)||[];
          item.subs=subsTmpl.map(sub=>{
            const sid=newId();
            _state.obcheck[sid]=BLANK(); _state.obcheck[sid].r=sub.r||'';
            return {id:sid,t:sub.t};
          });
          changed=true;
        }else if(tmpl && Array.isArray(tmpl.subs) && tmpl.subs.length===item.subs.length){
          // sincroniza o texto (ex.: capitalização) com o molde actual, só se ainda nada foi marcado
          const noneDone=item.subs.every(s=>!chkState(s.id).d);
          if(noneDone){
            item.subs.forEach((s,i)=>{
              const t=tmpl.subs[i];
              if(s.t!==t.t){ s.t=t.t; changed=true; }
              if(t.r && chkState(s.id).r!==t.r){ _state.obcheck[s.id].r=t.r; changed=true; }
            });
          }
        }
        // o texto das opções/sub-ações já vive na checklist — não repetir como descrição a fade
        if((item.subs||[]).length && chkState(item.id).o){
          _state.obcheck[item.id].o=''; changed=true;
        }
      });
    });
    if(changed)_push();
  }
  function zones(){ seed(); migrate(); return _state.obzones; }
  function chkState(id){ return _state.obcheck[id]||BLANK(); }
  function setDone(id,v){ const m=_state.obcheck; if(!m[id])m[id]=BLANK(); m[id].d=v?1:0; _push(); }
  function setField(id,k,v){ const m=_state.obcheck; if(!m[id])m[id]=BLANK(); m[id][k]=v; _push(); }

  function zoneStats(zi){
    const z=zones()[zi]; let d=0;
    z.items.forEach(it=>{ if(chkState(it.id).d)d++; });
    return {d,total:z.items.length};
  }
  function subStats(item){
    const subs=item.subs||[]; let d=0;
    subs.forEach(s=>{ if(chkState(s.id).d)d++; });
    return {d,total:subs.length};
  }
  function globalStats(){
    let d=0,total=0;
    zones().forEach((_,zi)=>{const st=zoneStats(zi); d+=st.d; total+=st.total;});
    return {d,total};
  }
  function zoneDone(st){ return st.total>0 && st.d===st.total; }
  function updateProgress(){
    const g=globalStats();
    const p=g.total?Math.round(g.d/g.total*100):0;
    document.getElementById('pct').textContent=p+'%';
    document.getElementById('progress-fill').style.width=p+'%';
    document.getElementById('sub').textContent=`${g.d} de ${g.total} itens concluídos`;
  }

  function renderSubs(item,inEdit){
    const subs=item.subs||[];
    if(!inEdit && subs.length===0)return '';
    const isChoice=item.kind==='choice';
    const lbl=isChoice?'Opções (escolher uma)':'Sub-ações';
    const addLbl=isChoice?'＋ Adicionar opção':'＋ Adicionar sub-ação';
    let countHtml='';
    if(!isChoice && subs.length){
      const sst=subStats(item);
      const countCls=sst.total>0 && sst.d===sst.total?' all':'';
      countHtml=`<span class="subs-count${countCls}">${sst.d}/${sst.total}</span>`;
    }
    let html=`<div class="subs"><div class="subs-hd"><span class="subs-lbl">${lbl}</span>${countHtml}</div>`;
    if(inEdit){
      // edição de texto/responsável é igual para opções e sub-ações — só muda a apresentação normal (radio vs check)
      html+=`<div class="subs-list">`+subs.map(sub=>{
        const s=chkState(sub.id);
        return `<div class="sub-edit-row" data-item-id="${item.id}">`+
          `<input class="edit-inp sm" data-subid="${sub.id}" data-f="t" value="${esc(sub.t)}" placeholder="${isChoice?'Opção…':'Sub-ação…'}">`+
          `<input class="edit-inp sm" data-subid="${sub.id}" data-f="r" value="${esc(s.r)}" placeholder="Resp.…" style="max-width:110px">`+
          `<button class="sub-del-btn" data-subid="${sub.id}" data-item-id="${item.id}" title="Apagar">🗑</button>`+
        `</div>`;
      }).join('')+`</div>`+
      `<button class="add-sub-btn" data-item-id="${item.id}">${addLbl}</button>`;
    }else if(isChoice){
      const chosen=chkState(item.id).choice||'';
      html+=`<div class="subs-list">`+subs.map(sub=>{
        const s=chkState(sub.id);
        const sel=chosen===sub.id;
        return `<div class="opt-item${sel?' sel':''}" data-subid="${sub.id}" data-item-id="${item.id}">`+
          `<div class="opt-radio"></div>`+
          `<div class="opt-label">${esc(sub.t)}</div>`+
          (s.r?`<span class="opt-resp">${esc(s.r)}</span>`:'')+
        `</div>`;
      }).join('')+`</div>`;
    }else{
      html+=`<div class="subs-list">`+subs.map(sub=>{
        const s=chkState(sub.id);
        return `<div class="sub-item${s.d?' on':''}" data-subid="${sub.id}" data-item-id="${item.id}">`+
          `<div class="sub-ck-box">${s.d?'✓':''}</div>`+
          `<div class="sub-label">${esc(sub.t)}</div>`+
          (s.r?`<span class="sub-resp">${esc(s.r)}</span>`:'')+
        `</div>`;
      }).join('')+`</div>`;
    }
    html+=`</div>`;
    return html;
  }

  function render(){
    const body=document.getElementById('body');
    body.innerHTML='';
    zones().forEach((z,zi)=>{
      const st=zoneStats(zi);
      const zone=document.createElement('div');
      zone.className='zone'+(zoneDone(st)?' zdone':'');
      zone.dataset.zi=zi;
      zone.style.setProperty('--zc',z.c);
      const zp=st.total?Math.round(st.d/st.total*100):0;
      const hd=document.createElement('div');hd.className='zone-hd';
      hd.innerHTML=`<span class="zone-dot"></span><span class="zone-name">${esc(z.z)}</span><span class="zone-count">✅${st.d}/${st.total}</span><span class="zone-pct">${zp}%</span>`;
      zone.appendChild(hd);
      z.items.forEach(item=>{
        const s=chkState(item.id);
        const it=document.createElement('div');
        it.className='item'+(s.d?' done':'')+(editMode?' editing':'');
        it.dataset.id=item.id;
        if(editMode){
          it.innerHTML=
            `<div class="edit-top-row">`+
              `<div class="edit-col">`+
                `<input class="edit-inp" data-id="${item.id}" data-f="t" value="${esc(item.t)}" placeholder="Descrição do item…">`+
                `<div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center">`+
                  ownerSelectHtml(item.id,s.owner)+
                  `<input class="edit-inp sm" data-id="${item.id}" data-f="r" value="${esc(s.r)}" placeholder="Responsável…" style="flex:1;min-width:120px">`+
                `</div>`+
                `<input class="edit-inp sm" data-id="${item.id}" data-f="o" value="${esc(s.o)}" placeholder="Observações…">`+
              `</div>`+
              `<button class="del-btn" data-id="${item.id}" title="Apagar item">🗑</button>`+
            `</div>`+
            renderSubs(item,true);
        }else{
          it.innerHTML=
            `<div class="item-top">`+
              `<div class="checks">`+
                `<div class="ck${s.d?' on':''}" data-id="${item.id}"><div class="ck-box">${s.d?'✓':''}</div><div class="ck-cap">Concluído</div></div>`+
              `</div>`+
              `<div class="item-body">`+
                `<div class="label">${esc(item.t)}</div>`+
                `<div class="meta">`+
                  ownerSelectHtml(item.id,s.owner)+
                  (s.r?`<span class="resp">👤 ${esc(s.r)}</span>`:'')+
                `</div>`+
                (s.o && !(item.subs&&item.subs.length)?`<div class="obs">${esc(s.o)}</div>`:'')+
              `</div>`+
            `</div>`+
            renderSubs(item,false);
        }
        zone.appendChild(it);
      });
      if(editMode){
        const add=document.createElement('button');
        add.className='add-btn'; add.dataset.zi=zi; add.textContent='＋ Adicionar item';
        zone.appendChild(add);
      }
      body.appendChild(zone);
    });
    updateProgress();
  }
  function setEdit(on){
    editMode=on;
    const b=document.getElementById('edit-btn');
    b.classList.toggle('on',on); b.textContent=on?'✓ Concluir':'✏️ Editar';
    render();
  }

  function syncHeaderHeight(){
    const h=document.querySelector('.stickytop').offsetHeight;
    document.documentElement.style.setProperty('--hdh',h+'px');
  }
  window.addEventListener('resize',syncHeaderHeight);
  window.addEventListener('orientationchange',()=>setTimeout(syncHeaderHeight,150));

  document.getElementById('edit-btn').addEventListener('click',()=>{setEdit(!editMode);syncHeaderHeight();});

  document.getElementById('body').addEventListener('click',e=>{
    // apagar item
    const del=e.target.closest('.del-btn');
    if(del){
      const id=del.dataset.id;
      for(const z of zones()){
        const ix=z.items.findIndex(x=>x.id===id);
        if(ix>=0){ (z.items[ix].subs||[]).forEach(s=>delete _state.obcheck[s.id]); z.items.splice(ix,1); break; }
      }
      delete _state.obcheck[id]; _push(); render();
      if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
      return;
    }
    // apagar sub-ação
    const subDel=e.target.closest('.sub-del-btn');
    if(subDel){
      const subId=subDel.dataset.subid, itemId=subDel.dataset.itemId;
      for(const z of zones()){
        const item=z.items.find(x=>x.id===itemId);
        if(item){ const ix=(item.subs||[]).findIndex(s=>s.id===subId); if(ix>=0)item.subs.splice(ix,1); break; }
      }
      delete _state.obcheck[subId]; _push(); render();
      return;
    }
    // adicionar item
    const add=e.target.closest('.add-btn');
    if(add){
      const zi=+add.dataset.zi, id=newId();
      _state.obcheck[id]=BLANK();
      zones()[zi].items.push({id,t:'',subs:[]}); _push(); render();
      const inp=document.querySelector(`.edit-inp[data-id="${id}"][data-f="t"]`);
      if(inp)inp.focus();
      return;
    }
    // adicionar sub-ação
    const addSub=e.target.closest('.add-sub-btn');
    if(addSub){
      const itemId=addSub.dataset.itemId, sid=newId();
      _state.obcheck[sid]=BLANK();
      for(const z of zones()){
        const item=z.items.find(x=>x.id===itemId);
        if(item){ if(!item.subs)item.subs=[]; item.subs.push({id:sid,t:''}); break; }
      }
      _push(); render();
      const inp=document.querySelector(`.edit-inp[data-subid="${sid}"][data-f="t"]`);
      if(inp)inp.focus();
      return;
    }
    // escolher uma opção (não conta para a checklist/%, é só a decisão)
    const optItem=e.target.closest('.opt-item');
    if(optItem){
      const subId=optItem.dataset.subid, itemId=optItem.dataset.itemId;
      setField(itemId,'choice',subId);
      optItem.closest('.subs-list').querySelectorAll('.opt-item').forEach(el=>el.classList.remove('sel'));
      optItem.classList.add('sel');
      if(navigator.vibrate)try{navigator.vibrate(6)}catch(e){}
      return;
    }
    // marcar sub-ação concluída
    const subItem=e.target.closest('.sub-item');
    if(subItem){
      const subId=subItem.dataset.subid, on=!chkState(subId).d;
      setDone(subId,on);
      subItem.classList.toggle('on',on);
      subItem.querySelector('.sub-ck-box').textContent=on?'✓':'';
      const itemEl=subItem.closest('.item'), itemId=subItem.dataset.itemId;
      let item=null; for(const z of zones()){item=z.items.find(x=>x.id===itemId); if(item)break;}
      if(item){
        const sst=subStats(item);
        const countEl=itemEl.querySelector('.subs-count');
        if(countEl){ countEl.textContent=`${sst.d}/${sst.total}`; countEl.classList.toggle('all',sst.total>0&&sst.d===sst.total); }
      }
      if(navigator.vibrate)try{navigator.vibrate(6)}catch(e){}
      return;
    }
    // marcar item concluído
    const ck=e.target.closest('.ck'); if(!ck||editMode)return;
    const id=ck.dataset.id, on=!chkState(id).d;
    setDone(id,on);
    ck.classList.toggle('on',on);
    ck.querySelector('.ck-box').textContent=on?'✓':'';
    ck.closest('.item').classList.toggle('done',on);
    const zone=ck.closest('.zone'), st=zoneStats(+zone.dataset.zi);
    zone.querySelector('.zone-count').textContent=`✅${st.d}/${st.total}`;
    zone.querySelector('.zone-pct').textContent=(st.total?Math.round(st.d/st.total*100):0)+'%';
    zone.classList.toggle('zdone',zoneDone(st));
    updateProgress();
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  });

  document.getElementById('body').addEventListener('input',e=>{
    const inp=e.target.closest('.edit-inp'); if(!inp)return;
    if(inp.dataset.subid){
      const subId=inp.dataset.subid, f=inp.dataset.f;
      if(f==='t'){
        for(const z of zones()){
          for(const item of z.items){ const sub=(item.subs||[]).find(s=>s.id===subId); if(sub){ sub.t=inp.value; break; } }
        }
        _push();
      }else{
        setField(subId,f,inp.value);
      }
      return;
    }
    const id=inp.dataset.id, f=inp.dataset.f;
    if(f==='t'){
      for(const z of zones()){const item=z.items.find(x=>x.id===id); if(item){item.t=inp.value;break;}}
      _push();
    }else{
      setField(id,f,inp.value);
    }
  });

  document.getElementById('body').addEventListener('change',e=>{
    const sel=e.target.closest('.owner-select'); if(!sel)return;
    const id=sel.dataset.id, val=sel.value, oc=ownerColor(val);
    setField(id,'owner',val);
    sel.style.setProperty('--oc',oc||'');
    sel.parentElement.style.setProperty('--oc',oc||'');
  });

  /* ── ASYNC INIT — carrega estado do GitHub, renderiza, depois faz polling ── */
  (async()=>{
    _setSyncDot('load');
    try{
      const d=await _ghRead();
      if(d){
        _state=d;
        if(!_state.obcheck||typeof _state.obcheck!=='object')_state.obcheck={};
      }
    }catch(e){}
    try{ render(); syncHeaderHeight(); }catch(e){ console.error('render error',e); }
    _setSyncDot('ok');

    setInterval(async()=>{
      if(_dirty)return;
      try{
        const d=await _ghRead();
        if(!d)return;
        if(!d.obcheck||typeof d.obcheck!=='object')d.obcheck={};
        if(JSON.stringify(d)!==JSON.stringify(_state)){
          _state=d;
          render();
          _setSyncDot('ok');
        }
      }catch(e){}
    },30000);
  })();
})();
</script>
</body>
</html>
